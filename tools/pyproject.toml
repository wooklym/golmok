[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golmok-tools"
version = "0.1.0"
description = "Golmok capture tools: EXIF check, video frame extraction, face/plate blur"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "exifread>=3.0",
]

[project.optional-dependencies]
# PyTorch: on Windows + RTX 50 series, install CUDA 12.8+ wheels first (see tools/README.md).
blur = ["torch", "torchvision"]
raw = ["rawpy"]
heic = ["pillow", "pillow-heif"]
basemap = ["pyshp>=2.3", "pyproj>=3.6", "shapely>=2.0", "mapbox-earcut>=1.0", "rasterio>=1.3"]
zone = ["jsonschema>=4.18", "pyproj>=3.6", "shapely>=2.0"]
dev = ["pytest", "pillow", "piexif", "pygltflib", "ruff>=0.6"]

[project.scripts]
golmok-exif = "golmok_tools.exif_report:main"
golmok-frames = "golmok_tools.extract_frames:main"
golmok-blur = "golmok_tools.privacy.blur:main"
golmok-basemap = "golmok_tools.basemap.build:main"
golmok-perf = "golmok_tools.perf_report:main"
golmok-zone = "golmok_tools.zone.cli:main"

[tool.setuptools.packages.find]
include = ["golmok_tools*"]

[tool.setuptools.package-data]
# Copies of docs/spec/*.schema.json (tests/test_zone_schema.py keeps them identical)
"golmok_tools.zone" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["golmok_tools"]
