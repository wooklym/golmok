name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"  # Korean output on the Windows runner (cp1252 console)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          # Same OS as the user's PC: catches path and encoding problems
          - { os: windows-latest, python: "3.12" }
          # [WP-20 hook] D-022: the only dev/verification machine is now an Apple Silicon Mac
          - { os: macos-latest, python: "3.12" }
    defaults:
      run:
        working-directory: tools
    steps:
      # [WP-01 hook] actions Node 24 majors (2026-10-08)
      - uses: actions/checkout@v7
        with:
          lfs: false  # tests need no binary assets
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[basemap,zone,mesh,splat,align,dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_repo.py
        run: python tools/scripts/check_repo.py

  tiles-validate:
    # Optional: 3D Tiles validation of the synthetic basemap built by tests/test_basemap.py
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build synthetic basemap
        working-directory: tools
        env:
          GOLMOK_BASEMAP_OUT: ${{ runner.temp }}/basemap
        run: |
          python -m pip install -e ".[basemap,zone,splat,dev]"
          pytest -q tests/test_basemap.py
      - name: Splat tileset (KHR_gaussian_splatting) through 3d-tiles-validator
        working-directory: tools
        env:
          GOLMOK_TILES_VALIDATOR: "1"
        run: pytest -q tests/test_splat.py -k validator
      - name: 3d-tiles-validator
        run: |
          npx --yes 3d-tiles-validator@0.6.1 --tilesetFile "$RUNNER_TEMP/basemap/tileset.json" | tee validator.log
          grep -q '"numErrors": 0' validator.log

  # [J-11 hook] review viewer headless smoke (tools/viewer npm test), ubuntu-24.04 only (Playwright 1.56.1 does not support 26.04)
  viewer-smoke:
    name: viewer-smoke (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/viewer
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # the smoke builds its own synthetic basemap and zones
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python tools
        working-directory: tools
        timeout-minutes: 10
        run: python -m pip install -e ".[basemap,zone,mesh,splat,align,dev]"
      - name: npm install
        timeout-minutes: 5
        run: |
          npm install --no-audit --no-fund
          npm ls --depth=0
      - name: Playwright Chromium (with OS deps)
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: npm test
        timeout-minutes: 10
        run: npm test
  # [/J-11 hook]
