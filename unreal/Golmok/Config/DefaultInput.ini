[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.PlayerInput]
; The engine's BaseInput.ini binds F1/F2/F5 to view modes and F9 to "shot showui" in non-shipping builds
; (DebugExecBindings run in PIE next to the Enhanced Input actions). Golmok uses F1 HUD, F2 collision,
; F5 next preset, F9 record, F10 play (AGolmokPlayerController), so drop the engine set and keep only the
; harmless view-mode keys.
!DebugExecBindings=ClearArray
+DebugExecBindings=(Key=F3,Command="viewmode lit")
+DebugExecBindings=(Key=F4,Command="viewmode lit_detaillighting")
