[/Script/UnrealEd.ProjectPackagingSettings]
; WP-04: zone manifests are plain files under Content/Golmok/Zones/<zone_id>/v<n>/ (manifest.json, blockers.json).
; Stage that folder into the packaged build so AGolmokZone can read them with FFileHelper at runtime.
+DirectoriesToAlwaysStageAsUFS=(Path="Golmok/Zones")
; WP-05: lighting_presets.json lives under Config/Golmok (Python and C++ read the same file); see runbook section 9 if it is missing in a package.
+DirectoriesToAlwaysStageAsUFS=(Path="../Config/Golmok")
; WP-05: interior sublevels are streamed by package path (LoadLevelInstance), so no map references them; cook the whole zone tree.
+DirectoriesToAlwaysCook=(Path="/Game/Golmok/Zones")

[/Script/Golmok.GolmokZoneSubsystem]
; Distance hysteresis (m) between the player pawn and a zone footprint: load inside LoadRadiusM, unload outside UnloadRadiusM.
LoadRadiusM=150
UnloadRadiusM=250
; Seconds between zone distance / basemap-hiding evaluations (never per frame).
UpdateIntervalSeconds=0.5
; Loads (requests) / unloads per evaluation (spreads hitches when several zones change at once).
MaxLoadsPerUpdate=1
MaxUnloadsPerUpdate=2
; Interior zones are driven by portals (WP-05); set True to manage them by distance as well.
bAutoManageInterior=False
; Overlap loser: spec hides its visual layer only; True also disables its collision.
bSuppressLoserCollision=False
; Runtime hiding of basemap actors under loaded zones (D-012: build-time exclude is the real mechanism).
bHideBasemap=True
BasemapTag=GolmokBasemap
BasemapTerrainTag=GolmokBasemapTerrain
; Periodic rescan for tagged basemap actors (s); 0 = only at BeginPlay, sublevel changes and golmok.zone.refresh.
BasemapRescanSeconds=0
; WP-09: discover zones around the player from Content/Golmok/Zones/index (golmok-zone index build output synced by zone_index.sync). Silently off without zones.json.
bDiscoverFromIndex=True
; Seconds between index lookups (inside the Evaluate timer, before Evaluate; never per frame).
DiscoveryIntervalSeconds=2.0
; Discovered, unloaded zones outside the 3x3 cells and farther than this (m) are destroyed; 0 = 2 x UnloadRadiusM.
DespawnDistanceM=0
; Those conditions must hold this long (s) first (no spawn / destroy thrash at cell borders).
DespawnGraceSeconds=10

[/Script/Golmok.GolmokZone]
; WP-09: chunk / collision assets stream through FStreamableManager (state Loading, built next tick); False keeps the WP-04 synchronous path.
bAsyncLoad=True
; Chunks whose SM_<chunk_id> asset is missing show an orange wire box the size of bbox_enu.
bDrawMissingAssetBoxes=True
; Thickness (cm) of the invisible boxes built from blockers.json planes.
BlockerThicknessCm=10

[/Script/Golmok.GolmokTimeOfDay]
; Seconds for preset / interior-overlay transitions (0 = instant). Tick runs only while transitioning.
TransitionSeconds=2.0
; Relative to <Project>/Config unless absolute.
PresetsFile=Golmok/lighting_presets.json
; Applied instantly at BeginPlay; empty = keep the level's authored lighting until a key / golmok.tod is used.
InitialPreset=
InteriorPreset=interior
; Actor tag that pins which DirectionalLight / SkyLight / ExponentialHeightFog / PostProcessVolume the presets drive.
LightingActorTag=GolmokLighting

