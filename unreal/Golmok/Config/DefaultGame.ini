[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=204ADAEB172840B0B91F6A91A4D1DC85
ProjectName=Golmok

[/Script/Golmok.GolmokCharacter]
; Mannequin from the UE "Third Person" content pack (Content Browser > Add > Add Feature or Content Pack).
; If these assets are missing the character still works and shows its capsule instead.
CharacterMeshPath=/Game/Characters/Mannequins/Meshes/SKM_Manny_Simple.SKM_Manny_Simple
AnimClassPath=/Game/Characters/Mannequins/Anims/Unarmed/ABP_Unarmed.ABP_Unarmed_C
WalkSpeed=180
RunSpeed=500
bInvertLookY=False

[/Script/UnrealEd.ProjectPackagingSettings]
; WP-04: zone manifests are plain files under Content/Golmok/Zones/<zone_id>/v<n>/ (manifest.json, blockers.json).
; Stage that folder into the packaged build so AGolmokZone can read them with FFileHelper at runtime.
+DirectoriesToAlwaysStageAsUFS=(Path="Golmok/Zones")

[/Script/Golmok.GolmokZoneSubsystem]
; Distance hysteresis (m) between the player pawn and a zone footprint: load inside LoadRadiusM, unload outside UnloadRadiusM.
LoadRadiusM=150
UnloadRadiusM=250
; Seconds between zone distance / basemap-hiding evaluations (never per frame).
UpdateIntervalSeconds=0.5
; Synchronous loads / unloads per evaluation (spreads hitches when several zones change at once).
MaxLoadsPerUpdate=1
MaxUnloadsPerUpdate=2
; Interior zones are driven by portals (WP-05); set True to manage them by distance as well.
bAutoManageInterior=False
; Overlap loser: spec hides its visual layer only; True also disables its collision.
bSuppressLoserCollision=False
; Runtime hiding of basemap actors under loaded zones (D-012: build-time exclude is the real mechanism).
bHideBasemap=True
BasemapTag=GolmokBasemap
BasemapTerrainTag=GolmokBasemapTerrain
; Periodic rescan for tagged basemap actors (s); 0 = only at BeginPlay, sublevel changes and golmok.zone.refresh.
BasemapRescanSeconds=0

[/Script/Golmok.GolmokZone]
; Asynchronous asset loading is a TODO (FStreamableManager); the flag only warns for now.
bAsyncLoad=False
; Chunks whose SM_<chunk_id> asset is missing show an orange wire box the size of bbox_enu.
bDrawMissingAssetBoxes=True
; Thickness (cm) of the invisible boxes built from blockers.json planes.
BlockerThicknessCm=10
